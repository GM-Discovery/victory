# Kernel 100: the Windows consumer's compose file. Deliberately a
# separate file from ../../podman/compose.yml (the Linux dev-loop proof
# of concept), not a shared one, because the two have exactly one
# necessary difference: a consumer's machine has no Victory source tree
# or Dockerfile to build from, so the backend service here references a
# published image instead of a local build context. Everything else
# (required-not-defaulted secrets, localhost-only binding, volumes) is
# identical on purpose -- keep them in sync by hand until a real image
# registry/publishing pipeline exists to template both from one source.
#
# NOT YET DONE: VICTORY_BACKEND_IMAGE has no real published image behind
# it yet -- there is no CI step in this repository that builds and
# pushes backend/Dockerfile's image to a registry. This file is correct
# in shape (what a consumer install must reference) but will not
# actually run until that publishing pipeline exists. Tracked as
# necessary follow-up work, not an oversight.

services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: victory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victory
      POSTGRES_USER: victory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- generated by VictoryLauncher's first-run setup}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - victory_postgres_data:/var/lib/postgresql/data
    networks:
      - victory_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victory -d victory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${VICTORY_BACKEND_IMAGE:?VICTORY_BACKEND_IMAGE must be set to a published Victory backend image -- see this file's header comment}
    container_name: victory-backend
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: postgres://victory:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- generated by VictoryLauncher's first-run setup}@victory-postgres:5432/victory?sslmode=disable
      STORAGE_ROOT: ${STORAGE_ROOT:?STORAGE_ROOT must be set to a real persistent path}
      OPERATOR_HANDLE: ${OPERATOR_HANDLE:?OPERATOR_HANDLE must come from first-run setup, not a fixed default}
      DEFAULT_LOCATION_SLUG: ${DEFAULT_LOCATION_SLUG:?DEFAULT_LOCATION_SLUG must come from first-run setup, not a fixed default}
      DEFAULT_LOCATION_NAME: ${DEFAULT_LOCATION_NAME:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BACKUP_DIR: ${BACKUP_DIR:?BACKUP_DIR must be set to a real persistent path}
      EXPORTS_ROOT: ${EXPORTS_ROOT:?EXPORTS_ROOT must be set to a real persistent path}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}
      DISCORD_OAUTH_SCOPES: ${DISCORD_OAUTH_SCOPES:-identify email}
      DISCORD_OAUTH_ENABLED: ${DISCORD_OAUTH_ENABLED:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_PERMISSIONS: ${DISCORD_BOT_PERMISSIONS:-16}
      DISCORD_BOT_REDIRECT_URL: ${DISCORD_BOT_REDIRECT_URL:-}
      DISCORD_SERVER_LINK_ENABLED: ${DISCORD_SERVER_LINK_ENABLED:-}
      DISCORD_GATEWAY_INTENTS: ${DISCORD_GATEWAY_INTENTS:-641}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set to a real persistent path}:${STORAGE_ROOT:?STORAGE_ROOT must be set to a real persistent path}
      - ${BACKUP_DIR:?BACKUP_DIR must be set to a real persistent path}:${BACKUP_DIR:?BACKUP_DIR must be set to a real persistent path}
      - ${EXPORTS_ROOT:?EXPORTS_ROOT must be set to a real persistent path}:${EXPORTS_ROOT:?EXPORTS_ROOT must be set to a real persistent path}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8081"
    networks:
      - victory_internal

volumes:
  victory_postgres_data:

networks:
  victory_internal:
