services:
  postgres:
    image: postgres:16-alpine
    container_name: victory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victory
      POSTGRES_USER: victory
      POSTGRES_PASSWORD: change_this_now
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - victory_postgres_data:/var/lib/postgresql/data
    networks:
      - victory_internal

  backend:
    build:
      context: ./backend
    container_name: victory-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8081}
      DATABASE_URL: postgres://victory:REDACTED@victory-postgres:5432/victory?sslmode=disable
      STORAGE_ROOT: ${STORAGE_ROOT:-/opt/victory/storage}
      OPERATOR_HANDLE: ${OPERATOR_HANDLE:-straturli}
      DEFAULT_LOCATION_SLUG: ${DEFAULT_LOCATION_SLUG:-victory-theater}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}
      DISCORD_OAUTH_SCOPES: ${DISCORD_OAUTH_SCOPES:-identify email}
      DISCORD_OAUTH_ENABLED: ${DISCORD_OAUTH_ENABLED:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_PERMISSIONS: ${DISCORD_BOT_PERMISSIONS:-16}
      DISCORD_BOT_REDIRECT_URL: ${DISCORD_BOT_REDIRECT_URL:-}
      DISCORD_SERVER_LINK_ENABLED: ${DISCORD_SERVER_LINK_ENABLED:-}
      DISCORD_GATEWAY_INTENTS: ${DISCORD_GATEWAY_INTENTS:-513}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-}
    depends_on:
      - postgres
    volumes:
      - /opt/victory/storage:/opt/victory/storage
    expose:
      - "8081"
    networks:
      - victory_internal
      - edge_net

volumes:
  victory_postgres_data:

networks:
  edge_net:
    external: true
    name: edge_net
  victory_internal:
