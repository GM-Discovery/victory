services:
  postgres:
    image: postgres:16-alpine
    container_name: victory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victory
      POSTGRES_USER: victory
      POSTGRES_PASSWORD: change_this_now
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - victory_postgres_data:/var/lib/postgresql/data
    networks:
      - victory_internal

  backend:
    build:
      context: ./backend
    container_name: victory-backend
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: postgres://victory:REDACTED@victory-postgres:5432/victory?sslmode=disable
      STORAGE_ROOT: /opt/victory/storage
      OPERATOR_HANDLE: straturli
    depends_on:
      - postgres
    volumes:
      - /opt/victory/storage:/opt/victory/storage
    expose:
      - "8081"
    networks:
      - victory_internal
      - edge_net

volumes:
  victory_postgres_data:

networks:
  edge_net:
    external: true
    name: edge_net
  victory_internal:
