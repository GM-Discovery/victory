services:
  postgres:
    # Kernel 77 K77-09: pinned to a digest rather than the floating
    # `16-alpine` tag, so a routine `docker compose pull` cannot silently
    # swap in a different image. Corresponds to postgres:16-alpine as of
    # 2026-08-02; re-pin deliberately (docker pull postgres:16-alpine &&
    # docker inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')
    # when a newer 16.x patch is wanted.
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: victory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: victory
      POSTGRES_USER: victory
      # Kernel 76 (K76-H03): this was the literal string `change_this_now`,
      # committed to the repository and in use as the live production
      # credential. The value now comes from .env (chmod 600, gitignored) and
      # the compose file no longer carries a usable secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - victory_postgres_data:/var/lib/postgresql/data
    networks:
      - victory_internal

  backend:
    build:
      context: ./backend
    container_name: victory-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8081}
      DATABASE_URL: postgres://victory:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@victory-postgres:5432/victory?sslmode=disable
      STORAGE_ROOT: ${STORAGE_ROOT:-/opt/victory/storage}
      # Kernel 96: this used to default to "straturli" (Grant's own handle)
      # when unset, silently granting operator authority to his account on
      # any fresh install that didn't override it. access.IsOperatorUser
      # already treats an empty value as "no env-based override" safely --
      # in-app Producer role grants (victory-bootstrap) work without this
      # ever being set at all.
      OPERATOR_HANDLE: ${OPERATOR_HANDLE:-}
      DEFAULT_LOCATION_SLUG: ${DEFAULT_LOCATION_SLUG:-victory-theater}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-}
      BACKUP_DIR: ${BACKUP_DIR:-/opt/victory/backups}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL:-}
      DISCORD_OAUTH_SCOPES: ${DISCORD_OAUTH_SCOPES:-identify email}
      DISCORD_OAUTH_ENABLED: ${DISCORD_OAUTH_ENABLED:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_PERMISSIONS: ${DISCORD_BOT_PERMISSIONS:-16}
      DISCORD_BOT_REDIRECT_URL: ${DISCORD_BOT_REDIRECT_URL:-}
      DISCORD_SERVER_LINK_ENABLED: ${DISCORD_SERVER_LINK_ENABLED:-}
      DISCORD_GATEWAY_INTENTS: ${DISCORD_GATEWAY_INTENTS:-641}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-}
      # Kernel 77: self-service recovery email and the export staging path.
      # docker-compose only forwards variables explicitly listed here --
      # being present in .env alone (used for this file's own ${...}
      # substitution) does not put them in the container's environment.
      EXPORTS_ROOT: ${EXPORTS_ROOT:-/opt/victory/exports}
      RECOVERY_EMAIL_ENABLED: ${RECOVERY_EMAIL_ENABLED:-}
      RECOVERY_EMAIL_FROM: ${RECOVERY_EMAIL_FROM:-}
      RECOVERY_EMAIL_FROM_NAME: ${RECOVERY_EMAIL_FROM_NAME:-Victory}
      RECOVERY_EMAIL_BASE_URL: ${RECOVERY_EMAIL_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    depends_on:
      - postgres
    volumes:
      - /opt/victory/storage:/opt/victory/storage
      - /opt/victory/backups:/opt/victory/backups
      - /opt/victory/exports:/opt/victory/exports
    expose:
      - "8081"
    networks:
      - victory_internal
      - edge_net

volumes:
  victory_postgres_data:

networks:
  edge_net:
    external: true
    name: edge_net
  victory_internal:
