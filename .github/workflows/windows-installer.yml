name: Windows installer build

# Kernel 100: proves the VictoryLauncher project actually compiles on a
# real Windows toolchain. There is no Windows dev machine in this
# project's normal workflow -- this workflow IS the build/test
# environment for the installer, standing in for one (K100 Checkpoint A
# left this open; windows-latest closes it without requiring Grant to
# own Windows hardware).
#
# Also packs and publishes a real Velopack release on every push, so
# Grant's own test install can pick up each change through the
# in-app auto-updater (UpdateChecker.cs) without a manual rebuild.
# Not yet signing anything -- that's still pending a real certificate.
#
# Publishing needs RELEASES_REPO_TOKEN: a GitHub personal access token
# (classic, `repo` scope, or fine-grained with contents:write) that can
# push to GM-Discovery/victory-releases specifically -- this repo's own
# ambient GITHUB_TOKEN can only ever act on this repo, never a different
# one. Add it under Settings > Secrets and variables > Actions in THIS
# repo (victory, not victory-releases). Until that secret exists, only
# the upload-to-github-releases half of the pack/upload step below
# fails -- vpk pack itself doesn't need it, so a real installer .exe is
# still produced and uploaded as this run's own artifact either way.

on:
  push:
    branches: [main, windows-native]
    paths:
      - "packaging/windows/**"
      - "backend/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "backend/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packaging/windows/VictoryLauncher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- needed to diff against github.event.before below

      # Kernel 100 §33: the launcher must not restart victory-backend.exe
      # (a real, disruptive outage) unless the backend actually changed --
      # a frontend-only release applies immediately with no outage at all,
      # so it needs to know which kind of release this is. Computed here,
      # not guessed client-side, since CI is the only place that actually
      # knows what changed in this push.
      - name: Determine whether the backend changed
        id: backend_changed
        shell: bash
        run: |
          if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT" # no prior commit to diff against -- assume changed, safer than assuming not
          elif git -C "$GITHUB_WORKSPACE" diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- backend/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # windows-native: the launcher supervises the Victory backend as a
      # plain native process (RuntimeManager.StartBackendAsync), not a
      # container -- it needs the actual .exe bundled alongside it.
      # Building this native ON windows-latest rather than
      # cross-compiling from Linux CI, even though Go could do either,
      # so this one job is the single source of truth for "does the
      # whole Windows package actually work together."
      - name: Build victory-backend.exe
        working-directory: backend
        run: go build -o ../packaging/windows/VictoryLauncher/victory-backend.exe ./cmd/victory

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish (self-contained win-x64)
        run: dotnet publish --configuration Release --no-restore -r win-x64 --self-contained true -o publish

      # publish/ itself (the raw folder) is intentionally NOT uploaded as
      # its own artifact anymore, now that vpk pack below reliably
      # produces a real installer: testing the loose folder means
      # testing something meaningfully different from what ships (no
      # install hooks, no shortcuts, and the auto-updater flatly refuses
      # to run against it -- UpdateChecker checks IsInstalled first).
      # publish/ still exists here purely as vpk pack's input.

      # No formal version scheme exists yet -- 0.0.<run number> is a
      # simple, always-increasing placeholder that's good enough for
      # Velopack to recognize "there's a newer one," not a real semantic
      # version. Revisit once real releases (and signing) are a thing.
      - name: Pack and publish Velopack release
        if: github.event_name != 'pull_request'
        env:
          VPK_GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/GM-Discovery/victory-releases --token $env:VPK_GITHUB_TOKEN
          vpk pack -u VictoryLauncher -v 0.0.${{ github.run_number }} -p publish -e VictoryLauncher.exe
          vpk upload github --repoUrl https://github.com/GM-Discovery/victory-releases --token $env:VPK_GITHUB_TOKEN --publish --releaseName "Victory 0.0.${{ github.run_number }}" --tag v0.0.${{ github.run_number }}
        continue-on-error: true # see this workflow's header: the upload half is expected to fail until RELEASES_REPO_TOKEN exists; vpk pack itself already succeeds without it

      # A small extra file attached to the same release, read by
      # UpdateChecker.cs before deciding whether an update can apply
      # immediately (frontend-only) or must wait for the 2:30am-local
      # quiet window (backend changed). Same RELEASES_REPO_TOKEN as the
      # vpk upload above, same expected-to-fail-until-the-secret-exists
      # story.
      - name: Upload update manifest to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          echo '{"backend_changed": ${{ steps.backend_changed.outputs.changed }}}' > update-manifest.json
          gh release upload "v0.0.${{ github.run_number }}" update-manifest.json --repo GM-Discovery/victory-releases --clobber
        continue-on-error: true

      # Uploaded regardless of whether the upload-to-github-releases step
      # above succeeded: vpk pack itself doesn't need RELEASES_REPO_TOKEN
      # at all, so this is real proof the packaging step works (a real
      # installer .exe, not just a raw publish folder) even before
      # publishing is wired up.
      - name: Upload packed Velopack release
        uses: actions/upload-artifact@v4
        with:
          name: VictoryLauncher-Setup
          path: packaging/windows/VictoryLauncher/Releases/
          retention-days: 14
