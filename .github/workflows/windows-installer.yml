name: Windows installer build

# Kernel 100: proves the VictoryLauncher project actually compiles on a
# real Windows toolchain. There is no Windows dev machine in this
# project's normal workflow -- this workflow IS the build/test
# environment for the installer, standing in for one (K100 Checkpoint A
# left this open; windows-latest closes it without requiring Grant to
# own Windows hardware).
#
# Also packs and publishes a real Velopack release on every push, so
# Grant's own test install can pick up each change through the
# in-app auto-updater (UpdateChecker.cs) without a manual rebuild.
# Not yet signing anything -- that's still pending a real certificate.
#
# Publishing needs RELEASES_REPO_TOKEN: a GitHub personal access token
# (classic, `repo` scope, or fine-grained with contents:write) that can
# push to GM-Discovery/victory-releases specifically -- this repo's own
# ambient GITHUB_TOKEN can only ever act on this repo, never a different
# one. Add it under Settings > Secrets and variables > Actions in THIS
# repo (victory, not victory-releases). Until that secret exists and
# GM-Discovery/victory-releases exists as a public repo, the pack/upload
# steps below will fail -- the build/publish steps above them still
# succeed and upload their own artifact independently either way.

on:
  push:
    branches: [main, windows-native]
    paths:
      - "packaging/windows/**"
      - "backend/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "backend/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packaging/windows/VictoryLauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # windows-native: the launcher supervises the Victory backend as a
      # plain native process (RuntimeManager.StartBackendAsync), not a
      # container -- it needs the actual .exe bundled alongside it.
      # Building this native ON windows-latest rather than
      # cross-compiling from Linux CI, even though Go could do either,
      # so this one job is the single source of truth for "does the
      # whole Windows package actually work together."
      - name: Build victory-backend.exe
        working-directory: backend
        run: go build -o ../packaging/windows/VictoryLauncher/victory-backend.exe ./cmd/victory

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish (self-contained win-x64)
        run: dotnet publish --configuration Release --no-restore -r win-x64 --self-contained true -o publish

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: VictoryLauncher-win-x64
          path: packaging/windows/VictoryLauncher/publish/
          retention-days: 14

      # No formal version scheme exists yet -- 0.0.<run number> is a
      # simple, always-increasing placeholder that's good enough for
      # Velopack to recognize "there's a newer one," not a real semantic
      # version. Revisit once real releases (and signing) are a thing.
      - name: Pack and publish Velopack release
        if: github.event_name != 'pull_request'
        env:
          VPK_GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/GM-Discovery/victory-releases --token $env:VPK_GITHUB_TOKEN
          vpk pack -u VictoryLauncher -v 0.0.${{ github.run_number }} -p publish -e VictoryLauncher.exe
          vpk upload github --repoUrl https://github.com/GM-Discovery/victory-releases --token $env:VPK_GITHUB_TOKEN --publish --releaseName "Victory 0.0.${{ github.run_number }}" --tag v0.0.${{ github.run_number }}
        continue-on-error: true # see this workflow's header: expected to fail until RELEASES_REPO_TOKEN and the releases repo both exist
