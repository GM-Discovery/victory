<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password — Victory</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #0d0b0c;
      --field: #151113;
      --crimson: #a30d2d;
      --crimson-bright: #d31943;
      --text: #f6edf0;
      --muted: #bda9ae;
      --line: rgba(211, 25, 67, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(163, 13, 45, 0.22), transparent 34%),
        linear-gradient(135deg, #020202 0%, #0b0708 52%, #030303 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: min(420px, calc(100vw - 32px));
      padding: 34px;
      border-radius: 6px;
      background: linear-gradient(155deg, rgba(17, 14, 15, 0.98), rgba(7, 7, 7, 0.99));
      border: 1px solid var(--line);
      border-top: 3px solid var(--crimson);
      box-shadow: 0 26px 80px rgba(0,0,0,0.72), 0 0 34px rgba(163,13,45,0.1);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }
    p { color: var(--muted); line-height: 1.5; }
    .field { margin-bottom: 17px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: #e7d9dd;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.13);
      background: var(--field);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--crimson-bright);
      background: #1a1114;
      box-shadow: 0 0 0 3px rgba(211,25,67,0.16);
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d92b50;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--crimson-bright), #8b0926);
      color: #fff7f9;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
    }
    .status { margin-top: 14px; min-height: 1.2em; color: #ff6d8e; }
    .back-link { display: inline-block; margin-top: 16px; color: #ff6d8e; text-decoration: none; }
    a:hover { color: #ff9aaf; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Forgot Password</h1>
    <p>Enter the email on your account. If it's verified for recovery, we'll send a link to reset your password.</p>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <button type="submit">Send Recovery Email</button>
    </form>

    <div id="status" class="status"></div>

    <p style="margin-top:16px;font-size:0.85rem;">
      Signed up with Discord and don't remember setting a password? <a href="/auth/discord/start" style="color:#ff6d8e;">Log in with Discord</a> instead.
    </p>

    <a class="back-link" href="/login/">Back to log in</a>
  </div>

  <script>
    const form = document.getElementById("forgot-form");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) return;

      statusEl.style.color = "#ff6d8e";
      statusEl.textContent = "Sending...";
      form.querySelector("button").disabled = true;

      try {
        const response = await fetch("/api/auth/password-reset/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const payload = await response.json().catch(() => ({}));

        if (response.status === 410) {
          statusEl.textContent = "Self-service password recovery isn't available right now. Sign in with Discord, or contact the operator for a recovery link.";
          return;
        }
        if (!response.ok || !payload.ok) {
          statusEl.textContent = payload.error ? `Could not process that request (${payload.error}).` : "Could not process that request.";
          return;
        }

        statusEl.style.color = "#bda9ae";
        statusEl.textContent = payload.message || "If that address can receive a Victory recovery message, one has been sent.";
        form.style.display = "none";
      } catch (error) {
        statusEl.textContent = "Could not reach the server. Try again.";
      } finally {
        form.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
