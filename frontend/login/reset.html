<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Set Password — Victory</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #0d0b0c;
      --field: #151113;
      --crimson: #a30d2d;
      --crimson-bright: #d31943;
      --crimson-dark: #5f071b;
      --text: #f6edf0;
      --muted: #bda9ae;
      --line: rgba(211, 25, 67, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(163, 13, 45, 0.22), transparent 34%),
        linear-gradient(135deg, #020202 0%, #0b0708 52%, #030303 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 47%, rgba(211, 25, 67, 0.05) 47.2% 47.8%, transparent 48%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 72px);
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      position: relative;
      padding: 34px;
      border-radius: 6px;
      background: linear-gradient(155deg, rgba(17, 14, 15, 0.98), rgba(7, 7, 7, 0.99));
      border: 1px solid var(--line);
      border-top: 3px solid var(--crimson);
      box-shadow: 0 26px 80px rgba(0,0,0,0.72), 0 0 34px rgba(163,13,45,0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e7d9dd;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.13);
      background: var(--field);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: var(--crimson-bright);
      background: #1a1114;
      box-shadow: 0 0 0 3px rgba(211,25,67,0.16);
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d92b50;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--crimson-bright), #8b0926);
      color: #fff7f9;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.025em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(163,13,45,0.22);
      transition: filter 160ms ease, transform 160ms ease;
    }

    button:hover {
      filter: brightness(1.13);
      transform: translateY(-1px);
    }

    .provider-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 14px;
      color: #7f6a70;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .provider-divider::before,
    .provider-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .discord-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid rgba(211,25,67,0.42);
      background: #100d0e;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .discord-button:hover {
      background: #1d1014;
      border-color: var(--crimson-bright);
    }

    .discord-button[aria-disabled="true"] {
      opacity: 0.55;
      pointer-events: none;
    }

    .provider-note {
      margin-top: 8px;
      color: #8f7c81;
      font-size: 0.92rem;
    }

    .status {
      margin-top: 14px;
      min-height: 1.2em;
      color: #ff6d8e;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #ff6d8e;
      text-decoration: none;
    }

    a:hover { color: #ff9aaf; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Set Password</h1>
    <p id="intro">Choose a password for your Victory account. This link works once.</p>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required />
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" required />
      </div>

      <button type="submit">Set Password</button>
    </form>

    <div id="status" class="status"></div>

    <a class="back-link" href="/login/">Back to log in</a>
  </div>

  <script>
    const form = document.getElementById("reset-form");
    const statusEl = document.getElementById("status");
    const intro = document.getElementById("intro");
    const token = new URL(window.location.href).searchParams.get("token") || "";

    if (!token) {
      form.style.display = "none";
      intro.textContent =
        "This page needs a recovery link. Ask the Victory operator to issue one, or log in with Discord.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        statusEl.textContent = "Those passwords do not match.";
        return;
      }

      statusEl.textContent = "Setting password...";

      try {
        const response = await fetch("/api/auth/password-reset/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ token, new_password: password })
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.ok) {
          throw new Error(
            payload.error === "invalid_or_expired_token"
              ? "That recovery link has expired or was already used. Ask the operator for a new one."
              : payload.error || `Could not set password (HTTP ${response.status})`
          );
        }

        statusEl.textContent = "Password set. You are signed in. Redirecting...";
        window.location.href = "/";
      } catch (error) {
        statusEl.textContent = error.message || String(error);
      }
    });
  </script>
</body>
</html>
