<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Victory</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #0d0b0c;
      --field: #151113;
      --crimson: #a30d2d;
      --crimson-bright: #d31943;
      --crimson-dark: #5f071b;
      --text: #f6edf0;
      --muted: #bda9ae;
      --line: rgba(211, 25, 67, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(163, 13, 45, 0.22), transparent 34%),
        linear-gradient(135deg, #020202 0%, #0b0708 52%, #030303 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 47%, rgba(211, 25, 67, 0.05) 47.2% 47.8%, transparent 48%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 72px);
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      position: relative;
      padding: 34px;
      border-radius: 6px;
      background: linear-gradient(155deg, rgba(17, 14, 15, 0.98), rgba(7, 7, 7, 0.99));
      border: 1px solid var(--line);
      border-top: 3px solid var(--crimson);
      box-shadow: 0 26px 80px rgba(0,0,0,0.72), 0 0 34px rgba(163,13,45,0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e7d9dd;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.13);
      background: var(--field);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: var(--crimson-bright);
      background: #1a1114;
      box-shadow: 0 0 0 3px rgba(211,25,67,0.16);
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d92b50;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--crimson-bright), #8b0926);
      color: #fff7f9;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.025em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(163,13,45,0.22);
      transition: filter 160ms ease, transform 160ms ease;
    }

    button:hover {
      filter: brightness(1.13);
      transform: translateY(-1px);
    }

    .provider-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 14px;
      color: #7f6a70;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .provider-divider::before,
    .provider-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .discord-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid rgba(211,25,67,0.42);
      background: #100d0e;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .discord-button:hover {
      background: #1d1014;
      border-color: var(--crimson-bright);
    }

    .discord-button[aria-disabled="true"] {
      opacity: 0.55;
      pointer-events: none;
    }

    .provider-note {
      margin-top: 8px;
      color: #8f7c81;
      font-size: 0.92rem;
    }

    .status {
      margin-top: 14px;
      min-height: 1.2em;
      color: #ff6d8e;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #ff6d8e;
      text-decoration: none;
    }

    a:hover { color: #ff9aaf; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Log In</h1>
    <p>Enter your handle and password.</p>

    <form id="login-form">
      <div class="field">
        <label for="handle">Handle</label>
        <input id="handle" name="handle" type="text" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button type="submit">Log In</button>
    </form>

    <div class="provider-divider">Or</div>
    <a id="discord-login" class="discord-button" href="/auth/discord/start">Log in with Discord</a>
    <div id="provider-note" class="provider-note"></div>

    <p style="margin-top:16px;">
    Need an account? <a href="/signup/" style="color:#ff6d8e;">Sign up with Discord</a>
    </p>

    <p style="margin-top:8px;font-size:0.85rem;color:var(--muted);">
    Locked out? <a href="/login/forgot.html" style="color:#ff6d8e;">Reset your password</a>.
    </p>

    <div id="status" class="status"></div>

    <p style="margin-top:12px;font-size:0.8rem;">
    <a href="/legal/privacy/" style="color:var(--muted);">Privacy Policy</a>
    &nbsp;·&nbsp;
    <a href="/legal/terms/" style="color:var(--muted);">Terms of Service</a>
    </p>

    <a class="back-link" href="/">Back to map</a>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("status");
    const discordLogin = document.getElementById("discord-login");
    const providerNote = document.getElementById("provider-note");

    function safeReturnTo(raw) {
      const value = String(raw || "").trim();
      if (!value || !value.startsWith("/") || value.startsWith("//") || value.includes("://")) {
        return "/";
      }
      return value;
    }

    const returnTo = safeReturnTo(new URL(window.location.href).searchParams.get("return_to"));

    async function loadAuthProviders() {
      try {
        const response = await fetch("/api/auth/providers", { credentials: "include" });
        const payload = await response.json();
        const enabled = Boolean(payload && payload.ok && payload.data && payload.data.discord_enabled);
        if (!enabled) {
          discordLogin.setAttribute("aria-disabled", "true");
          discordLogin.removeAttribute("href");
          providerNote.textContent = "Discord login is not configured on this server.";
          return;
        }

        discordLogin.href = `/auth/discord/start?return_to=${encodeURIComponent(returnTo)}`;
      } catch (error) {
        discordLogin.setAttribute("aria-disabled", "true");
        discordLogin.removeAttribute("href");
        providerNote.textContent = "Discord login is temporarily unavailable.";
      }
    }

    async function redirectIfSignedIn() {
      try {
        const response = await fetch("/api/account/me", { credentials: "include" });
        if (!response.ok) {
          return false;
        }

        const payload = await response.json();
        if (payload && payload.ok && payload.data && payload.data.user) {
          window.location.replace("/account/");
          return true;
        }
      } catch (error) {
        return false;
      }

      return false;
    }

    redirectIfSignedIn();
    loadAuthProviders();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      statusEl.textContent = "Logging in...";

      const handle = document.getElementById("handle").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            handle,
            password
          })
        });

        const text = await response.text();

        let payload = {};
        try {
          payload = text ? JSON.parse(text) : {};
        } catch (err) {
          throw new Error(`Invalid JSON response: ${text}`);
        }

        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || `Login failed (HTTP ${response.status})`);
        }

        statusEl.textContent = "Login successful. Redirecting...";
        window.location.href = returnTo;
      } catch (error) {
        statusEl.textContent = error.message || String(error);
      }
    });
  </script>
</body>
</html>
