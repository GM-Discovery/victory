<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Writer's Room</title>
  <link rel="stylesheet" href="/lib/forbidden.css?v=hidden-fix-1" />
  <style>
    body {
      margin: 0;
      background: #0d0a05;
      color: #f0e8d8;
      font-family: Arial, Helvetica, sans-serif;
    }

    .shell {
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .page-header {
      max-width: 1200px;
      margin: 0 auto 20px;
    }

    .page-header h1 {
      margin: 0;
      color: #f2f2f2;
      letter-spacing: 0.01em;
    }

    .layout {
      display: flex;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      align-items: flex-start;
      justify-content: center;
    }

    .panel {
      background: #171208;
      border: 1px solid rgba(196, 155, 74, 0.25);
      border-radius: 14px;
      padding: 22px;
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .primary-col {
      flex: 0 1 800px;
      min-width: 0;
    }

    .primary-panel {
      border-color: rgba(196, 155, 74, 0.45);
      box-shadow: 0 0 32px rgba(180, 140, 60, 0.08);
    }

    .sidebar-col {
      flex: 0 0 300px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { margin-top: 0; }
    h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #d9b46a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .primary-panel h2 { font-size: 20px; }

    .status-line { margin-top: 8px; color: #b9a077; }
    .hidden { display: none; }

    .tree { list-style: none; padding-left: 0; }
    .tree ul {
      list-style: none;
      padding-left: 20px;
      border-left: 1px solid rgba(196, 155, 74, 0.2);
      margin: 4px 0;
    }
    .tree li { margin: 6px 0; }

    .kind-tag {
      display: inline-block;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #c9a45c;
      border: 1px solid rgba(201, 164, 92, 0.4);
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 7px;
    }

    .status-chip {
      display: inline-block;
      font-size: 10.5px;
      border-radius: 4px;
      padding: 1px 7px;
      margin-left: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-draft { background: rgba(180, 140, 40, 0.28); color: #e8c888; }
    .status-published { background: rgba(60, 140, 90, 0.25); color: #9ede9f; }
    .status-archived { background: rgba(120, 120, 120, 0.25); color: #c9c9c9; }

    .pub-link { color: #d9b46a; text-decoration: none; font-size: 15px; }
    .pub-link:hover { text-decoration: underline; }

    label { display: block; margin: 10px 0 4px; font-size: 13px; color: #b9a077; }

    input[type="text"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #17110a;
      color: #f0e8d8;
      border: 1px solid rgba(196, 155, 74, 0.3);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(212, 168, 82, 0.7);
    }

    .primary-panel textarea#cp-paste {
      min-height: 620px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    textarea { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; }

    button {
      background: #6b5327;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #83672f; }
    button:disabled { opacity: 0.5; cursor: default; }

    .primary-panel button {
      background: #96762f;
      font-size: 15px;
      padding: 11px 20px;
    }
    .primary-panel button:hover { background: #b28d3a; }

    .form-error { color: #e08a7a; font-size: 13px; margin-top: 8px; }
    .form-ok { color: #9ede9f; font-size: 13px; margin-top: 8px; }

    .recent-list { list-style: none; padding: 0; margin: 0; }
    .recent-list li {
      padding: 8px 10px;
      border: 1px solid rgba(196, 155, 74, 0.18);
      border-radius: 8px;
      margin-bottom: 8px;
      background: rgba(196, 155, 74, 0.04);
    }
    .recent-meta { color: #a89272; font-size: 12px; margin-top: 2px; }

    .import-report {
      background: #100c06;
      border: 1px solid rgba(196, 155, 74, 0.25);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
      max-height: 260px;
      overflow-y: auto;
    }
    .import-report ul { margin: 6px 0; padding-left: 18px; }
    .warn { color: #e8c888; }

    @media (max-width: 1140px) {
      .layout { flex-direction: column; align-items: stretch; }
      .primary-col { flex: 1 1 auto; }
      .sidebar-col { flex: 1 1 auto; flex-direction: row; }
      .sidebar-col > .panel { flex: 1; }
    }
    @media (max-width: 700px) {
      .sidebar-col { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="forbidden-screen" class="forbidden-screen" hidden>
    <div class="forbidden-card">
      <img src="/assets/redirect.png" alt="Security redirect" />
      <h1>Error: Forbidden Access Entry</h1>
      <p>The Writer's Room is a Crew workspace.</p>
      <a href="/" class="back-map-button">← Back to Map</a>
    </div>
  </div>

  <div class="shell">
    <div class="page-header">
      <h1>Writer's Room</h1>
      <div id="connection-status" class="status-line">Unlocking the door...</div>
    </div>

    <div id="dashboard" class="layout hidden">
      <div class="primary-col">
        <div class="panel primary-panel hidden" id="create-publication-panel">
          <h2>New eWriting</h2>
          <label for="cp-collection">Collection</label>
          <select id="cp-collection"></select>
          <label for="cp-title">Title</label>
          <input id="cp-title" type="text" placeholder="e.g. Social Stances" />
          <label for="cp-visibility">Visibility</label>
          <select id="cp-visibility">
            <option value="production">Production only</option>
            <option value="authenticated">Any signed-in reader</option>
            <option value="public">Public (served to signed-in readers for now)</option>
          </select>

          <label for="cp-file">Import a Markdown file (optional)</label>
          <input id="cp-file" type="file" accept=".md,.markdown,.txt" />
          <label for="cp-paste">…or paste Markdown (optional)</label>
          <textarea id="cp-paste" placeholder="# Title&#10;&#10;## Section..."></textarea>

          <button id="cp-create" type="button">Create eWriting</button>
          <div id="cp-message"></div>
          <div id="cp-report" class="import-report hidden"></div>
        </div>
      </div>

      <div class="sidebar-col">
        <div class="panel">
          <h2>Library</h2>
          <ul id="authoring-tree" class="tree"></ul>
          <p id="tree-empty" class="hidden" style="color:#c9a45c;font-style:italic;">No eWritings yet — create a Ruleset to begin.</p>

          <h2 style="margin-top:24px;">Recent drafts</h2>
          <ul id="recent-drafts" class="recent-list"></ul>
        </div>

        <div class="panel hidden" id="create-collection-panel">
          <h2>New collection</h2>
          <label for="cc-kind">Level</label>
          <select id="cc-kind">
            <option value="ruleset">Ruleset (top level)</option>
            <option value="series">Series (inside a Ruleset)</option>
            <option value="module">Module (inside a Ruleset or Series)</option>
          </select>
          <label for="cc-parent">Parent</label>
          <select id="cc-parent"></select>
          <label for="cc-title">Title</label>
          <input id="cc-title" type="text" placeholder="e.g. Socio: Stories of Us" />
          <label for="cc-visibility">Default visibility</label>
          <select id="cc-visibility">
            <option value="production">Production only</option>
            <option value="authenticated">Any signed-in reader</option>
            <option value="public">Public (served to signed-in readers for now)</option>
          </select>
          <button id="cc-create" type="button">Create collection</button>
          <div id="cc-message"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/lib/forbidden.js"></script>
  <script src="/lib/back-to-map.js"></script>
  <script src="/lib/venue-account-badge.js?v=nav-1"></script>
  <script>
    const connectionStatus = document.getElementById("connection-status");
    const dashboard = document.getElementById("dashboard");
    let treeData = null;

    function editorHref(pubId) {
      return "/venues/writers-room/edit.html?pub=" + encodeURIComponent(pubId);
    }

    function statusChip(status) {
      const span = document.createElement("span");
      span.className = "status-chip status-" + status;
      span.textContent = status;
      return span;
    }

    function renderTree() {
      const treeEl = document.getElementById("authoring-tree");
      treeEl.innerHTML = "";
      let pubCount = 0;

      for (const loc of treeData.locations) {
        const byParent = new Map();
        for (const c of loc.collections) {
          const key = c.parent_id || "";
          if (!byParent.has(key)) byParent.set(key, []);
          byParent.get(key).push(c);
        }
        const pubsByCollection = new Map();
        for (const p of loc.publications) {
          pubCount += 1;
          if (!pubsByCollection.has(p.collection_id)) pubsByCollection.set(p.collection_id, []);
          pubsByCollection.get(p.collection_id).push(p);
        }

        function renderCollection(c) {
          const li = document.createElement("li");
          const tag = document.createElement("span");
          tag.className = "kind-tag";
          tag.textContent = c.kind;
          li.appendChild(tag);
          const title = document.createElement("span");
          title.textContent = c.title;
          li.appendChild(title);

          const children = document.createElement("ul");
          for (const pub of pubsByCollection.get(c.id) || []) {
            const pli = document.createElement("li");
            const a = document.createElement("a");
            a.className = "pub-link";
            a.href = editorHref(pub.id);
            a.textContent = pub.title;
            pli.appendChild(a);
            pli.appendChild(statusChip(pub.status));
            children.appendChild(pli);
          }
          for (const child of byParent.get(c.id) || []) {
            children.appendChild(renderCollection(child));
          }
          if (children.childNodes.length > 0) li.appendChild(children);
          return li;
        }

        if (treeData.locations.length > 1) {
          const locHeader = document.createElement("li");
          locHeader.style.color = "#a89467";
          locHeader.textContent = loc.location_name;
          treeEl.appendChild(locHeader);
        }
        for (const root of byParent.get("") || []) {
          treeEl.appendChild(renderCollection(root));
        }
      }
      document.getElementById("tree-empty").classList.toggle("hidden", pubCount > 0 || collectionsFlat().length > 0);
    }

    function collectionsFlat() {
      const out = [];
      for (const loc of treeData.locations) {
        for (const c of loc.collections) out.push(c);
      }
      return out;
    }

    function renderRecentDrafts() {
      const list = document.getElementById("recent-drafts");
      list.innerHTML = "";
      const drafts = treeData.recent_drafts || [];
      if (drafts.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No drafts in progress.";
        li.style.color = "#8d8064";
        list.appendChild(li);
        return;
      }
      for (const d of drafts) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "pub-link";
        a.href = editorHref(d.id);
        a.textContent = d.title;
        li.appendChild(a);
        const meta = document.createElement("div");
        meta.className = "recent-meta";
        meta.textContent = (d.word_count ? d.word_count.toLocaleString() + " words · " : "") +
          "updated " + new Date(d.updated_at).toLocaleString();
        li.appendChild(meta);
        list.appendChild(li);
      }
    }

    function fillParentSelectors() {
      const kindSel = document.getElementById("cc-kind");
      const parentSel = document.getElementById("cc-parent");
      const collections = collectionsFlat();

      function refreshParents() {
        const kind = kindSel.value;
        parentSel.innerHTML = "";
        if (kind === "ruleset") {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "(top level)";
          parentSel.appendChild(opt);
          parentSel.disabled = true;
          return;
        }
        parentSel.disabled = false;
        const allowed = kind === "series" ? ["ruleset"] : ["ruleset", "series"];
        for (const c of collections.filter((c) => allowed.includes(c.kind))) {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.kind + ": " + c.title;
          parentSel.appendChild(opt);
        }
        if (!parentSel.childNodes.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "(create a " + (kind === "series" ? "Ruleset" : "Ruleset or Series") + " first)";
          parentSel.appendChild(opt);
        }
      }
      kindSel.addEventListener("change", refreshParents);
      refreshParents();

      const pubCollectionSel = document.getElementById("cp-collection");
      pubCollectionSel.innerHTML = "";
      for (const c of collections) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.kind + ": " + c.title;
        pubCollectionSel.appendChild(opt);
      }
    }

    function setMessage(id, text, ok) {
      const el = document.getElementById(id);
      el.className = ok ? "form-ok" : "form-error";
      el.textContent = text;
    }

    async function apiPost(url, body) {
      const res = await fetch(url, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const payload = await res.json().catch(() => null);
      return { res, payload };
    }

    async function createCollection() {
      const kind = document.getElementById("cc-kind").value;
      const parentSel = document.getElementById("cc-parent");
      const title = document.getElementById("cc-title").value.trim();
      if (!title) {
        setMessage("cc-message", "A title is required.", false);
        return;
      }
      const body = {
        kind,
        title,
        parent_id: parentSel.disabled ? "" : parentSel.value,
        visibility: document.getElementById("cc-visibility").value,
      };
      if (!parentSel.disabled && !body.parent_id) {
        setMessage("cc-message", "Pick a parent collection first.", false);
        return;
      }
      if (kind === "ruleset") {
        body.location_id = treeData.locations[0]?.location_id || "";
      }
      const { res, payload } = await apiPost("/api/ewrite/collections", body);
      if (!res.ok || !payload?.ok) {
        setMessage("cc-message", "Could not create: " + (payload?.data?.error || res.status), false);
        return;
      }
      setMessage("cc-message", "Created “" + title + "”.", true);
      document.getElementById("cc-title").value = "";
      await reloadTree();
    }

    function renderImportReport(report) {
      const el = document.getElementById("cp-report");
      el.innerHTML = "";
      const head = document.createElement("div");
      head.textContent = "Import recognized: " + report.heading_count + " headings (" +
        report.section_count + " sections, " + report.subsection_count + " subsections, " +
        report.spacer_count + " spacers) · " + report.word_count.toLocaleString() + " words · " +
        report.explicit_anchors + " explicit anchors";
      el.appendChild(head);
      if (report.warnings && report.warnings.length) {
        const wh = document.createElement("div");
        wh.className = "warn";
        wh.textContent = "Warnings:";
        el.appendChild(wh);
        const ul = document.createElement("ul");
        for (const w of report.warnings) {
          const li = document.createElement("li");
          li.className = "warn";
          li.textContent = w;
          ul.appendChild(li);
        }
        el.appendChild(ul);
      }
      el.classList.remove("hidden");
    }

    async function createPublication() {
      const collectionID = document.getElementById("cp-collection").value;
      const title = document.getElementById("cp-title").value.trim();
      const fileInput = document.getElementById("cp-file");
      const pasted = document.getElementById("cp-paste").value;
      const btn = document.getElementById("cp-create");
      if (!collectionID) {
        setMessage("cp-message", "Create a collection first.", false);
        return;
      }
      if (!title) {
        setMessage("cp-message", "A title is required.", false);
        return;
      }
      btn.disabled = true;
      try {
        const { res, payload } = await apiPost("/api/ewrite/publications", {
          collection_id: collectionID,
          title,
          visibility: document.getElementById("cp-visibility").value,
        });
        if (!res.ok || !payload?.ok) {
          setMessage("cp-message", "Could not create: " + (payload?.data?.error || res.status), false);
          return;
        }
        const pub = payload.data.publication;

        let source = pasted;
        const file = fileInput.files && fileInput.files[0];
        if (file) source = await file.text();

        if (source && source.trim()) {
          const form = new FormData();
          form.append("base_revision_id", "");
          if (file) {
            form.append("file", file);
          } else {
            form.append("source", source);
          }
          const importRes = await fetch("/api/ewrite/publications/" + encodeURIComponent(pub.id) + "/import", {
            method: "POST",
            credentials: "include",
            body: form,
          });
          const importPayload = await importRes.json().catch(() => null);
          if (!importRes.ok || !importPayload?.ok) {
            setMessage("cp-message", "Created, but import failed: " + (importPayload?.data?.error || importRes.status), false);
            return;
          }
          renderImportReport(importPayload.data.report);
          setMessage("cp-message", "Created and imported (" + importPayload.data.import_ms + "ms). Open it below or in the editor.", true);
        } else {
          setMessage("cp-message", "Created. Open the editor to start writing.", true);
        }
        const open = document.createElement("a");
        open.href = editorHref(pub.id);
        open.textContent = " Open in editor →";
        open.className = "pub-link";
        document.getElementById("cp-message").appendChild(open);
        await reloadTree();
      } finally {
        btn.disabled = false;
      }
    }

    async function reloadTree() {
      const response = await fetch("/api/ewrite/tree", { credentials: "include" });
      const payload = await response.json().catch(() => null);
      if (!response.ok || !payload?.ok) return false;
      treeData = payload.data;
      renderTree();
      renderRecentDrafts();
      fillParentSelectors();
      return true;
    }

    async function bootstrap() {
      try {
        const response = await fetch("/api/ewrite/tree", { credentials: "include" });
        const payload = await response.json().catch(() => null);
        if (isForbiddenAccessResponse(response, payload) || !response.ok || !payload?.ok) {
          showForbiddenScreen();
          return;
        }
        treeData = payload.data;
        connectionStatus.textContent = "Welcome back. The desk is yours.";
        renderTree();
        renderRecentDrafts();
        fillParentSelectors();
        dashboard.classList.remove("hidden");
        document.getElementById("create-collection-panel").classList.remove("hidden");
        document.getElementById("create-publication-panel").classList.remove("hidden");
        document.getElementById("cc-create").addEventListener("click", createCollection);
        document.getElementById("cp-create").addEventListener("click", createPublication);
      } catch (err) {
        console.error("writers-room bootstrap failed", err);
        showForbiddenScreen();
      }
    }

    bootstrap();
  </script>
</body>
</html>
