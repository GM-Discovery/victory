<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Warehouse</title>
  <link rel="stylesheet" href="/lib/forbidden.css?v=hidden-fix-1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #f7ede0;
      background:
        radial-gradient(circle at top, rgba(84, 114, 149, 0.18), transparent 24%),
        linear-gradient(180deg, #11161d 0%, #0a0d12 100%);
    }

    .card {
      width: min(760px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 22px;
      border: 1px solid rgba(255, 242, 214, 0.12);
      background: rgba(18, 23, 30, 0.92);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.34);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0 0 18px;
      color: #c3cfdb;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff6e8;
      background: linear-gradient(180deg, rgba(81, 109, 142, 0.96), rgba(44, 63, 84, 0.96));
      border: 1px solid rgba(166, 196, 235, 0.28);
      font-weight: 700;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: #f7ede0;
      background: rgba(31, 38, 47, 0.9);
      border: 1px solid rgba(255, 242, 214, 0.12);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Warehouse</h1>
    <p>
      Warehouse storage and asset management live in Producer's Office for now.
      Use that page to review storage policy, browse assets, and delete tombstoned entries.
    </p>
    <div class="actions">
      <a class="button" href="/venues/producers-office/#warehouse-storage-card">Open Warehouse Storage</a>
      <a class="chip" href="/venues/producers-office/">Open Producer's Office</a>
      <a class="chip" href="/">Back to Map</a>
    </div>
  </main>
</body>
</html>
