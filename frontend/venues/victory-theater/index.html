<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Victory Theater</title>
  <style>
    body {
      margin: 0;
      background: #17120d;
      color: #f3e6cf;
      font-family: Arial, Helvetica, sans-serif;
    }

    .shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .coming-soon-card {
      max-width: 480px;
      text-align: center;
    }

    .coming-soon-card h1 {
      font-size: 2rem;
      margin: 0 0 12px;
      letter-spacing: 0.02em;
    }

    .coming-soon-card p {
      margin: 0 0 8px;
      line-height: 1.5;
      color: #d8c7a8;
    }

    .coming-soon-card a {
      color: #f3e6cf;
      text-decoration: underline;
    }

    .back-map-button {
      display: inline-block;
      margin-top: 24px;
      color: #d8c7a8;
      text-decoration: none;
      border: 1px solid #4a3a26;
      border-radius: 8px;
      padding: 8px 16px;
    }

    .back-map-button:hover {
      color: #f3e6cf;
      border-color: #f3e6cf;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="coming-soon-card">
      <h1>Victory Theater</h1>
      <p>Coming Soon! Imagine your game here.</p>
      <p>Inquire with <a href="mailto:grant@amurray.family">grant@amurray.family</a>.</p>
      <a href="/" class="back-map-button">← Back to Map</a>
    </div>
  </main>

  <script src="/lib/back-to-map.js"></script>
  <script src="/lib/venue-account-badge.js?v=nav-1"></script>
</body>
</html>
