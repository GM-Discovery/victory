<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roster — Stage Management — Victory</title>
  <link rel="stylesheet" href="/lib/forbidden.css?v=hidden-fix-1" />
  <style>
    :root { color-scheme: dark; --bg: #17120e; --panel: rgba(27, 21, 17, 0.92); --line: rgba(255, 233, 197, 0.12); --accent: #f0d3a4; --accent-strong: #fff2d7; --muted: #d0bfa6; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(180deg, #17120e 0%, #0e0b09 100%); color: #f6ecdd; }
    .header { padding: 22px 24px 12px; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.18em; color: #d7ab6f; font-size: 0.76rem; margin: 0 0 8px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .launchbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
    .chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; text-decoration: none; border: 1px solid var(--line); padding: 11px 16px; color: var(--accent-strong); background: rgba(255, 255, 255, 0.03); font-weight: 700; cursor: pointer; font: inherit; }
    .chip:disabled { opacity: 0.6; cursor: default; }
    .chip.danger { border-color: rgba(240, 130, 100, 0.4); color: #ffd6c4; }
    .stage { max-width: 1100px; width: 100%; margin: 0 auto; padding: 8px 24px 48px; box-sizing: border-box; display: grid; gap: 22px; }
    [hidden] { display: none !important; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .field { display: grid; gap: 6px; }
    label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    input[type="text"], select { box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #211913; color: #fff6e9; padding: 12px 14px; font: inherit; }
    .status-line { color: var(--muted); min-height: 1.4em; }
    .section-title { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; color: var(--accent); margin: 0 0 10px; }
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 8px; }
    .roster-card { background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .roster-name-row { display: flex; align-items: center; gap: 12px; }
    .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.12); background: #241b15; flex-shrink: 0; }
    .thumb-empty { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; border: 1px dashed rgba(255,255,255,0.16); color: var(--muted); background: #201813; flex-shrink: 0; }
    .roster-name { margin: 0; font-weight: 700; color: var(--accent-strong); }
    .roster-role-label { margin: 2px 0 0; color: var(--muted); font-size: 0.82rem; }
    .roster-controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .roster-controls select { flex: 1; min-width: 100px; }
  </style>
</head>
<body>
  <div id="forbidden-screen" class="forbidden-screen" hidden>
    <div class="forbidden-card">
      <img src="/assets/redirect.png" alt="Security redirect" />
      <h1>Error: Forbidden Access Entry</h1>
      <p>Security redirects you to the pathway.</p>
      <a href="/" class="back-map-button">← Back to Map</a>
    </div>
  </div>

  <div class="shell">
    <header class="header">
      <p class="eyebrow">Victory / Stage Management</p>
      <h1 id="run-title">Roster</h1>
      <div class="launchbar">
        <a class="chip" id="run-link" href="#">Back to Show Run</a>
        <a class="chip" id="program-link" href="#">Audience Program</a>
      </div>
    </header>

    <main class="stage">
      <p class="status-line" id="status-line">Loading roster...</p>

      <section class="card" id="add-card" hidden>
        <p class="section-title">Add to roster</p>
        <div class="form-row">
          <div class="field">
            <label for="profile-input">Profile ID or Trailer link</label>
            <input type="text" id="profile-input" placeholder="Paste a Trailer link or profile ID" />
          </div>
          <div class="field">
            <label for="role-select">Role</label>
            <select id="role-select">
              <option value="player">Player</option>
              <option value="director">Director</option>
              <option value="producer">Producer</option>
              <option value="crew">Crew</option>
              <option value="audience">Audience</option>
              <option value="guest">Guest</option>
              <option value="observer">Observer</option>
            </select>
          </div>
          <button class="chip" type="button" id="add-member-button">Add</button>
        </div>
      </section>

      <section id="roster-sections"></section>
    </main>
  </div>

  <script src="/lib/forbidden.js"></script>
  <script src="/lib/back-to-map.js"></script>
  <script src="/lib/venue-account-badge.js?v=nav-1"></script>
  <script>
    function runIdFromQuery() {
      return new URLSearchParams(window.location.search).get("id") || "";
    }

    function extractProfileId(raw) {
      const value = raw.trim();
      try {
        const url = new URL(value, window.location.origin);
        const idParam = url.searchParams.get("id");
        if (idParam) return idParam;
      } catch (e) { /* not a URL, fall through */ }
      return value;
    }

    const roleOrder = ["audience", "player", "crew", "director", "producer", "guest", "observer", "custom"];
    const roleSectionTitles = {
      audience: "Audience", player: "Players", crew: "Crew", director: "Directors",
      producer: "Producers", guest: "Guests", observer: "Observers", custom: "Custom",
    };

    function renderRosterCard(member, runId, onChange) {
      const card = document.createElement("div");
      card.className = "roster-card";

      const nameRow = document.createElement("div");
      nameRow.className = "roster-name-row";
      if (member.portrait_url) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = member.portrait_url;
        img.alt = member.stage_name + " portrait";
        nameRow.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "thumb-empty";
        placeholder.textContent = "☺";
        nameRow.appendChild(placeholder);
      }
      const nameCol = document.createElement("div");
      const name = document.createElement("p");
      name.className = "roster-name";
      name.textContent = member.stage_name || "Unnamed Player";
      nameCol.appendChild(name);
      const roleLine = document.createElement("p");
      roleLine.className = "roster-role-label";
      roleLine.textContent = member.role_label;
      nameCol.appendChild(roleLine);
      nameRow.appendChild(nameCol);
      card.appendChild(nameRow);

      const controls = document.createElement("div");
      controls.className = "roster-controls";
      const roleSelect = document.createElement("select");
      for (const r of ["player", "director", "producer", "crew", "audience", "guest", "observer"]) {
        const opt = document.createElement("option");
        opt.value = r;
        opt.textContent = r.charAt(0).toUpperCase() + r.slice(1);
        if (r === member.role) opt.selected = true;
        roleSelect.appendChild(opt);
      }
      roleSelect.addEventListener("change", async () => {
        const res = await fetch(`/api/show-runs/${encodeURIComponent(runId)}/roster/${encodeURIComponent(member.member_id)}`, {
          method: "PATCH", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: roleSelect.value, program_visible: member.program_visible }),
        });
        const p = await res.json().catch(() => null);
        if (!res.ok || !p?.ok) { alert("Could not update role: " + (p?.data?.error || `HTTP ${res.status}`)); return; }
        onChange();
      });
      controls.appendChild(roleSelect);

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "chip danger";
      removeButton.textContent = "Remove";
      removeButton.addEventListener("click", async () => {
        const res = await fetch(`/api/show-runs/${encodeURIComponent(runId)}/roster/${encodeURIComponent(member.member_id)}`, { method: "DELETE", credentials: "include" });
        const p = await res.json().catch(() => null);
        if (!res.ok || !p?.ok) { alert("Could not remove member: " + (p?.data?.error || `HTTP ${res.status}`)); return; }
        onChange();
      });
      controls.appendChild(removeButton);

      const openLink = document.createElement("a");
      openLink.className = "chip";
      openLink.href = member.trailer_url;
      openLink.textContent = "Trailer";
      controls.appendChild(openLink);

      card.appendChild(controls);
      return card;
    }

    async function loadRoster(runId) {
      const response = await fetch(`/api/show-runs/${encodeURIComponent(runId)}/roster`, { credentials: "include" });
      const payload = await response.json().catch(() => null);
      if (isForbiddenAccessResponse(response, payload)) { showForbiddenScreen(); return; }
      if (!response.ok || !payload?.ok) {
        document.getElementById("status-line").textContent = "Could not load roster: " + (payload?.data?.error || `HTTP ${response.status}`);
        return;
      }
      document.getElementById("status-line").hidden = true;

      const members = payload.data.roster || [];
      const byRole = {};
      for (const m of members) {
        const key = roleOrder.includes(m.role) ? m.role : "custom";
        if (!byRole[key]) byRole[key] = [];
        byRole[key].push(m);
      }

      const container = document.getElementById("roster-sections");
      container.innerHTML = "";
      for (const role of roleOrder) {
        const items = byRole[role];
        if (!items || items.length === 0) continue;
        const section = document.createElement("section");
        section.className = "card";
        const title = document.createElement("p");
        title.className = "section-title";
        title.textContent = roleSectionTitles[role] + " (" + items.length + ")";
        section.appendChild(title);
        const grid = document.createElement("div");
        grid.className = "roster-grid";
        for (const m of items) grid.appendChild(renderRosterCard(m, runId, () => loadRoster(runId)));
        section.appendChild(grid);
        container.appendChild(section);
      }
      if (members.length === 0) {
        const empty = document.createElement("p");
        empty.className = "status-line";
        empty.textContent = "No one is on this roster yet.";
        container.appendChild(empty);
      }
    }

    async function bootstrap() {
      const sessionResponse = await fetch("/api/session/me", { credentials: "include" });
      const sessionPayload = await sessionResponse.json().catch(() => null);
      if (!sessionResponse.ok || !sessionPayload?.ok || !sessionPayload.signed_in) {
        showForbiddenScreen();
        return;
      }

      const runId = runIdFromQuery();
      if (!runId) {
        document.getElementById("status-line").textContent = "No Show Run specified.";
        return;
      }
      document.getElementById("run-link").href = "/venues/show-runs/run.html?id=" + encodeURIComponent(runId);
      document.getElementById("program-link").href = "/venues/show-runs/program.html?id=" + encodeURIComponent(runId);

      const runResponse = await fetch("/api/show-runs/" + encodeURIComponent(runId), { credentials: "include" });
      const runPayload = await runResponse.json().catch(() => null);
      if (isForbiddenAccessResponse(runResponse, runPayload)) { showForbiddenScreen(); return; }
      if (!runResponse.ok || !runPayload?.ok) {
        document.getElementById("status-line").textContent = "Could not load Show Run.";
        return;
      }
      document.getElementById("run-title").textContent = "Roster — " + runPayload.data.show_run.title;

      if (!runPayload.data.can_manage) {
        document.getElementById("status-line").textContent = "You do not manage this Show Run. Try the Audience Program instead.";
        return;
      }

      document.getElementById("add-card").hidden = false;
      document.getElementById("add-member-button").addEventListener("click", async (event) => {
        event.target.disabled = true;
        try {
          const profileId = extractProfileId(document.getElementById("profile-input").value);
          if (!profileId) { alert("Enter a profile ID or Trailer link."); return; }
          const role = document.getElementById("role-select").value;
          const res = await fetch(`/api/show-runs/${encodeURIComponent(runId)}/roster`, {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_profile_id: profileId, role }),
          });
          const p = await res.json().catch(() => null);
          if (!res.ok || !p?.ok) { alert("Could not add member: " + (p?.data?.error || `HTTP ${res.status}`)); return; }
          document.getElementById("profile-input").value = "";
          await loadRoster(runId);
        } finally {
          event.target.disabled = false;
        }
      });

      await loadRoster(runId);
    }

    bootstrap().catch((error) => {
      console.error("roster bootstrap failed", error);
      document.getElementById("status-line").textContent = "Something went wrong loading the roster.";
    });
  </script>
</body>
</html>
