<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accept Invite — Victory</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --panel: #0d0b0c;
      --field: #151113;
      --crimson: #a30d2d;
      --crimson-bright: #d31943;
      --text: #f6edf0;
      --muted: #bda9ae;
      --line: rgba(211, 25, 67, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(163, 13, 45, 0.22), transparent 34%),
        linear-gradient(135deg, #020202 0%, #0b0708 52%, #030303 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: min(460px, calc(100vw - 32px));
      position: relative;
      padding: 34px;
      border-radius: 6px;
      background: linear-gradient(155deg, rgba(17, 14, 15, 0.98), rgba(7, 7, 7, 0.99));
      border: 1px solid var(--line);
      border-top: 3px solid var(--crimson);
      box-shadow: 0 26px 80px rgba(0,0,0,0.72), 0 0 34px rgba(163,13,45,0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    p { color: var(--muted); line-height: 1.5; }

    .invite-summary {
      margin: 4px 0 20px;
      padding: 14px 16px;
      border-radius: 4px;
      background: rgba(211, 25, 67, 0.08);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .invite-summary strong { color: #ff9aaf; }

    .field { margin-bottom: 14px; }

    .hint {
      margin: 6px 0 0;
      color: #8f7c81;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e7d9dd;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.13);
      background: var(--field);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: var(--crimson-bright);
      background: #1a1114;
      box-shadow: 0 0 0 3px rgba(211,25,67,0.16);
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d92b50;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--crimson-bright), #8b0926);
      color: #fff7f9;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.025em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(163,13,45,0.22);
      transition: filter 160ms ease, transform 160ms ease;
    }

    button:hover { filter: brightness(1.13); transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: default; transform: none; filter: none; }

    .status {
      margin-top: 14px;
      min-height: 1.2em;
      color: #ff6d8e;
    }

    .links { margin-top: 16px; display: flex; justify-content: space-between; }
    .links a { color: #ff6d8e; text-decoration: none; }
    .links a:hover { color: #ff9aaf; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>You're Invited</h1>

    <div id="loading-state">
      <p>Checking your invite...</p>
    </div>

    <div id="invalid-state" hidden>
      <p id="invalid-message">This invite link isn't valid -- it may have expired, already been used, or been revoked.</p>
      <div class="links"><a href="/">Back to map</a></div>
    </div>

    <div id="valid-state" hidden>
      <div class="invite-summary">
        You've been invited to join <strong id="lot-name"></strong> as <strong id="target-role"></strong>.
      </div>

      <!-- Shown only when already signed in on this Victory -- no new account needed. -->
      <div id="existing-user-form" hidden>
        <button id="accept-existing-button" type="button">Accept and Join</button>
      </div>

      <!-- Shown only for a brand new account -- no Discord involved at all. -->
      <form id="new-account-form" hidden>
        <div class="field">
          <label for="handle">Handle</label>
          <input id="handle" name="handle" type="text" required />
          <p class="hint">This is your login name. Keep it stable.</p>
        </div>

        <div class="field">
          <label for="display_name">Display Name</label>
          <input id="display_name" name="display_name" type="text" placeholder="Public display name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field">
          <label for="password">Choose a Password</label>
          <input id="password" name="password" type="password" required />
        </div>

        <button type="submit">Create Account and Join</button>
      </form>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    const loadingState = document.getElementById("loading-state");
    const invalidState = document.getElementById("invalid-state");
    const invalidMessage = document.getElementById("invalid-message");
    const validState = document.getElementById("valid-state");
    const lotNameEl = document.getElementById("lot-name");
    const targetRoleEl = document.getElementById("target-role");
    const existingUserForm = document.getElementById("existing-user-form");
    const acceptExistingButton = document.getElementById("accept-existing-button");
    const newAccountForm = document.getElementById("new-account-form");
    const statusEl = document.getElementById("status");

    function showInvalid(message) {
      loadingState.hidden = true;
      invalidState.hidden = false;
      if (message) invalidMessage.textContent = message;
    }

    async function acceptInvite(extraFields) {
      statusEl.textContent = "Joining...";
      try {
        const response = await fetch("/api/invites/accept", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, ...extraFields }),
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok) {
          const code = payload?.error;
          if (code === "email_taken" || code === "handle_taken") {
            const field = code === "email_taken" ? "email" : "handle";
            const returnTo = encodeURIComponent(window.location.pathname + window.location.search);
            statusEl.innerHTML =
              `An account with that ${field} already exists here. ` +
              `<a href="/login/?return_to=${returnTo}">Sign in</a>, then open this invite link again to join.`;
            return;
          }
          throw new Error(code || `Could not accept invite (HTTP ${response.status})`);
        }
        statusEl.textContent = "You're in. Redirecting...";
        window.location.href = "/";
      } catch (error) {
        statusEl.textContent = error.message || String(error);
      }
    }

    (async () => {
      if (!token) {
        showInvalid("This invite link is missing its token.");
        return;
      }

      let preview;
      try {
        const res = await fetch(`/api/invites/preview?token=${encodeURIComponent(token)}`);
        const payload = await res.json();
        if (!res.ok || !payload?.ok || !payload.data?.valid) {
          showInvalid();
          return;
        }
        preview = payload.data;
      } catch {
        showInvalid("Could not check this invite -- try refreshing.");
        return;
      }

      lotNameEl.textContent = preview.lot_name;
      targetRoleEl.textContent = preview.target_role;
      loadingState.hidden = true;
      validState.hidden = false;

      // Already signed in on this Victory: just join, no new account.
      // Not signed in: the full account-creation form, no Discord
      // involved -- this is the whole point of a direct invite link.
      let alreadySignedIn = false;
      try {
        const res = await fetch("/api/account/me", { credentials: "include" });
        const payload = await res.json().catch(() => null);
        alreadySignedIn = Boolean(res.ok && payload?.ok && payload?.data?.user);
      } catch {
        // best effort -- treat as not signed in
      }

      if (alreadySignedIn) {
        existingUserForm.hidden = false;
        acceptExistingButton.addEventListener("click", () => acceptInvite({}));
      } else {
        newAccountForm.hidden = false;
        newAccountForm.addEventListener("submit", (event) => {
          event.preventDefault();
          acceptInvite({
            handle: document.getElementById("handle").value.trim(),
            display_name: document.getElementById("display_name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });
        });
      }
    })();
  </script>
</body>
</html>
